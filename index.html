<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Licenciatura en Matemáticas — Plan 1983</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ─── Tokens ─────────────────────────────────────────────── */
:root {
  --bg:        #F0EDE8;
  --surface:   #FAFAF8;
  --surface-2: #F0EDE8;
  --border:    #DDD9D2;

  --ink:       #18160F;
  --ink-2:     #524E46;
  --ink-3:     #9A968E;

  --blue:      #1D52C4;
  --blue-bg:   #EAF0FD;
  --blue-soft: #C8D8F9;

  --green:     #196B3C;
  --green-bg:  #E4F4EC;
  --green-mid: #2E7D52;

  --amber:     #92580A;
  --amber-bg:  #FEF3DC;
  --amber-bdr: rgba(146,88,10,.18);

  --r-sm:  8px;
  --r-md: 12px;
  --r-lg: 16px;

  --ease: 220ms cubic-bezier(.25,.8,.25,1);
}

/* ─── Reset ──────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }

/* ─── Body — mobile-first ────────────────────────────────── */
body {
  font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
  font-size: 16px;          /* comfortable base on phone */
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  /* safe padding: top for status bar, bottom for home indicator */
  padding: env(safe-area-inset-top, 0px) 0 calc(env(safe-area-inset-bottom,0px) + 4rem);
  -webkit-font-smoothing: antialiased;
}

/* ─── Sticky page header ─────────────────────────────────── */
.page-header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(240,237,232,.92);
  backdrop-filter: saturate(180%) blur(16px);
  -webkit-backdrop-filter: saturate(180%) blur(16px);
  border-bottom: 1px solid var(--border);
  padding: .9rem 1rem .85rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: .75rem;
}

.page-title {
  font-size: 1rem;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: -.02em;
  line-height: 1.2;
}
.page-subtitle {
  font-size: 11.5px;
  color: var(--ink-3);
  margin-top: 2px;
  font-weight: 400;
}

.global-pill {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 500;
  padding: 5px 11px;
  border-radius: 99px;
  background: var(--blue-bg);
  color: var(--blue);
  border: 1px solid var(--blue-soft);
  white-space: nowrap;
  flex-shrink: 0;
}

/* ─── Container ──────────────────────────────────────────── */
.container {
  max-width: 780px;
  margin: 0 auto;
  padding: 0 .875rem;
}

/* ─── Semester section ───────────────────────────────────── */
.semester-section { margin-top: 1.75rem; }

.semester-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: .5rem;
  margin-bottom: .6rem;
}

.semester-title {
  font-size: .9rem;
  font-weight: 700;
  color: var(--ink-2);
  letter-spacing: .04em;
  text-transform: uppercase;
}

.semester-credits {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--ink-3);
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 2px 8px;
  border-radius: 99px;
  white-space: nowrap;
}

/* Semester progress row */
.semester-progress-wrap {
  display: flex;
  align-items: center;
  gap: .5rem;
  margin-bottom: 1rem;
}
.semester-bar-track {
  flex: 1;
  height: 3px;
  background: var(--border);
  border-radius: 99px;
  overflow: hidden;
}
.semester-bar-fill {
  height: 100%;
  background: var(--blue);
  border-radius: 99px;
  transition: width .55s ease;
  width: 0%;
}
.semester-pct {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 500;
  color: var(--blue);
  min-width: 30px;
  text-align: right;
}

/* ─── Subjects stack (single column on mobile) ───────────── */
.subjects-grid {
  display: flex;
  flex-direction: column;
  gap: .75rem;
}
@media (min-width: 700px) {
  .subjects-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
  }
}

/* ─── Card ───────────────────────────────────────────────── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  overflow: hidden;
  /* subtle lift */
  box-shadow: 0 1px 0 rgba(255,255,255,.8) inset,
              0 1px 4px rgba(0,0,0,.05);
}

/* Card header — large tap target */
.card-header {
  display: flex;
  align-items: center;
  gap: .85rem;
  padding: 1rem 1rem;
  cursor: pointer;
  user-select: none;
  min-height: 72px;          /* generous touch target */
  -webkit-tap-highlight-color: transparent;
  transition: background var(--ease);
}
.card.open .card-header { background: var(--blue-bg); }

.card-icon {
  width: 46px;
  height: 46px;
  border-radius: var(--r-md);
  background: var(--blue-bg);
  border: 1px solid var(--blue-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.45rem;
  flex-shrink: 0;
}
.card.open .card-icon { background: white; }

.card-info { flex: 1; min-width: 0; }

.card-name {
  font-size: 1rem;           /* 16px — comfortable phone reading */
  font-weight: 700;
  color: var(--ink);
  line-height: 1.3;
  word-break: break-word;
}

.card-meta {
  display: flex;
  flex-wrap: wrap;
  gap: .3rem;
  margin-top: .4rem;
}
.meta-tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--ink-3);
  background: var(--surface-2);
  border: 1px solid var(--border);
  padding: 2px 7px;
  border-radius: 99px;
}
.meta-tag strong { color: var(--ink-2); font-weight: 500; }

/* Right side of card header */
.card-controls {
  display: flex;
  align-items: center;
  gap: .5rem;
  flex-shrink: 0;
}

/* Circular progress — bigger on mobile */
.circle-progress { width: 36px; height: 36px; flex-shrink: 0; }
.circle-bg { fill: none; stroke: var(--border); stroke-width: 3.5; }
.circle-fg {
  fill: none;
  stroke: var(--blue);
  stroke-width: 3.5;
  stroke-linecap: round;
  stroke-dasharray: 82;
  stroke-dashoffset: 82;
  transform: rotate(-90deg);
  transform-origin: 50% 50%;
  transition: stroke-dashoffset .5s ease;
}

.chevron {
  width: 22px;
  height: 22px;
  color: var(--ink-3);
  transition: transform .3s ease;
  flex-shrink: 0;
}
.card.open .chevron { transform: rotate(180deg); color: var(--blue); }

/* ─── Card body ──────────────────────────────────────────── */
.card-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height .5s cubic-bezier(.25,.8,.25,1);
}
.card.open .card-body { max-height: 9999px; }

/* ─── Tabs ───────────────────────────────────────────────── */
.tabs {
  display: flex;
  background: var(--surface-2);
  border-bottom: 1px solid var(--border);
  padding: 0 1rem;
}
.tab {
  font-size: 13.5px;
  font-weight: 600;
  padding: .75rem 1rem;      /* tall tab — easy to tap */
  cursor: pointer;
  color: var(--ink-3);
  border-bottom: 2.5px solid transparent;
  margin-bottom: -1px;
  transition: color var(--ease), border-color var(--ease);
  -webkit-tap-highlight-color: transparent;
}
.tab.active { color: var(--blue); border-bottom-color: var(--blue); }

.tab-panel { display: none; padding: 1rem; }
.tab-panel.active { display: block; }

/* ─── Section label ──────────────────────────────────────── */
.section-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin: 1.1rem 0 .5rem;
}
.section-label:first-child { margin-top: 0; }

/* ─── Temario ────────────────────────────────────────────── */
.tema-item {
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  overflow: hidden;
  margin-bottom: .6rem;
}
.tema-head {
  display: flex;
  align-items: flex-start;
  gap: .6rem;
  padding: .75rem .9rem;
  background: var(--surface-2);
}
.tema-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 500;
  color: var(--blue);
  background: var(--blue-bg);
  border: 1px solid var(--blue-soft);
  padding: 2px 6px;
  border-radius: 4px;
  flex-shrink: 0;
  margin-top: 1px;
}
.tema-name {
  font-size: 14px;           /* larger than before */
  font-weight: 600;
  color: var(--ink);
  line-height: 1.35;
}
.subtema {
  font-size: 13px;           /* readable at arm's length */
  color: var(--ink-2);
  padding: .55rem .9rem;
  border-top: 1px solid var(--border);
  line-height: 1.6;
  display: flex;
  gap: .55rem;
}
.subtema::before { content: "·"; color: var(--blue); flex-shrink: 0; margin-top: 2px; }

/* ─── Bibliography ───────────────────────────────────────── */
.book-card {
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  overflow: hidden;
  margin-bottom: .6rem;
}
.book-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 56px;          /* tap-friendly */
  padding: .75rem .9rem;
  cursor: pointer;
  gap: .75rem;
  background: var(--surface);
  -webkit-tap-highlight-color: transparent;
}
.book-left { display: flex; align-items: flex-start; gap: .6rem; flex: 1; min-width: 0; }
.book-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--blue);
  flex-shrink: 0;
  margin-top: .35rem;
}
.book-name {
  font-size: 13px;
  color: var(--ink-2);
  line-height: 1.5;
  word-break: break-word;
}
.book-right { display: flex; align-items: center; gap: .4rem; flex-shrink: 0; }
.book-pct {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 500;
  color: var(--blue);
  background: var(--blue-bg);
  padding: 2px 8px;
  border-radius: 99px;
  border: 1px solid var(--blue-soft);
}
.book-chev {
  width: 16px; height: 16px;
  color: var(--ink-3);
  transition: transform .25s ease;
  flex-shrink: 0;
}
.book-card.open .book-chev { transform: rotate(180deg); }

.book-progress { height: 3px; background: var(--border); }
.book-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--blue), #5B8DD9);
  transition: width .4s ease;
  width: 0%;
}

.book-body { max-height: 0; overflow: hidden; transition: max-height .35s ease; }
.book-card.open .book-body { max-height: 700px; }

.chapters-list { padding: .5rem .75rem .85rem; display: flex; flex-direction: column; gap: 1px; }

/* Chapter row — tall for thumb tapping */
.chapter-item {
  display: flex;
  align-items: center;
  gap: .75rem;
  padding: .65rem .5rem;
  border-radius: var(--r-sm);
  transition: background var(--ease);
  cursor: pointer;
  min-height: 44px;
}
.chapter-item:active { background: var(--surface-2); }
.chapter-item.read { background: var(--green-bg); }

.cap-check {
  width: 20px;              /* larger checkbox on touch */
  height: 20px;
  border: 2px solid var(--border);
  border-radius: 5px;
  flex-shrink: 0;
  cursor: pointer;
  appearance: none;
  -webkit-appearance: none;
  background: white;
  position: relative;
  transition: all var(--ease);
}
.cap-check:checked { background: var(--green-mid); border-color: var(--green-mid); }
.cap-check:checked::after {
  content: '';
  position: absolute;
  width: 5px; height: 9px;
  border: 2px solid white;
  border-top: none; border-left: none;
  transform: rotate(45deg) translate(0px,-1px);
  left: 4px; top: 1px;
}
.chapter-label {
  font-size: 13px;
  color: var(--ink-2);
  line-height: 1.45;
  flex: 1;
  cursor: pointer;
}
.chapter-item.read .chapter-label {
  color: var(--green);
  text-decoration: line-through;
  text-decoration-color: rgba(46,125,82,.4);
}

/* ─── Complementary ──────────────────────────────────────── */
.comp-section {
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  overflow: hidden;
  margin-top: .35rem;
}
.comp-toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 48px;
  padding: .75rem .9rem;
  cursor: pointer;
  background: var(--surface-2);
  -webkit-tap-highlight-color: transparent;
}
.comp-title { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.comp-chev {
  width: 16px; height: 16px;
  color: var(--ink-3);
  transition: transform .25s;
  flex-shrink: 0;
}
.comp-section.open .comp-chev { transform: rotate(180deg); }
.comp-body { max-height: 0; overflow: hidden; transition: max-height .35s ease; }
.comp-section.open .comp-body { max-height: 700px; }
.comp-entry {
  font-size: 12.5px;
  color: var(--ink-3);
  padding: .6rem .9rem;
  border-top: 1px solid var(--border);
  line-height: 1.55;
  display: flex;
  gap: .5rem;
}
.comp-entry::before { content: "→"; color: var(--border); flex-shrink: 0; }

/* ─── Subsecuentes ───────────────────────────────────────── */
.subsec-block {
  margin: 0 1rem 1rem;
  padding: .9rem 1rem;
  background: var(--amber-bg);
  border: 1px solid var(--amber-bdr);
  border-radius: var(--r-md);
}
.subsec-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--amber);
  margin-bottom: .55rem;
}
.subsec-tags { display: flex; flex-wrap: wrap; gap: .4rem; }
.subsec-tag {
  font-size: 12px;
  color: var(--amber);
  background: white;
  border: 1px solid var(--amber-bdr);
  padding: 4px 11px;
  border-radius: 99px;
}

/* ─── Empty ──────────────────────────────────────────────── */
.empty-semester {
  padding: 2rem 1rem;
  text-align: center;
  color: var(--ink-3);
  font-size: 13px;
  font-style: italic;
  border: 1.5px dashed var(--border);
  border-radius: var(--r-lg);
}
</style>
</head>

// ═══════════════════════════════════════════════════════════
// STATE MANAGER
// ═══════════════════════════════════════════════════════════

const STORAGE_VERSION = 'v2_';

const State = {
  get(key) {
    try { return JSON.parse(localStorage.getItem(STORAGE_VERSION + key)) ?? null; }
    catch { return null; }
  },
  set(key, value) {
    try { localStorage.setItem(STORAGE_VERSION + key, JSON.stringify(value)); }
    catch { /* storage full or unavailable */ }
  }
};

// ═══════════════════════════════════════════════════════════
// PROGRESS HELPERS
// ═══════════════════════════════════════════════════════════

function getBookProgress(subjectId, bookIdx) {
  return State.get(`prog_${subjectId}_${bookIdx}`) ?? [];
}

function setBookProgress(subjectId, bookIdx, states) {
  State.set(`prog_${subjectId}_${bookIdx}`, states);
}

function calcSubjectProgress(materia) {
  let total = 0, done = 0;
  materia.bibBasicas.forEach((book, i) => {
    const states = getBookProgress(materia.id, i);
    total += book.caps.length;
    done  += book.caps.filter((_, ci) => states[ci] === true).length;
  });
  return total === 0 ? 0 : Math.round((done / total) * 100);
}

function calcSemesterProgress(materias) {
  if (!materias.length) return 0;
  const sum = materias.reduce((acc, m) => acc + calcSubjectProgress(m), 0);
  return Math.round(sum / materias.length);
}

function calcGlobalProgress() {
  const all = CURRICULUM.flatMap(s => s.materias);
  if (!all.length) return 0;
  const sum = all.reduce((acc, m) => acc + calcSubjectProgress(m), 0);
  return Math.round(sum / all.length);
}

// ═══════════════════════════════════════════════════════════
// DOM HELPERS
// ═══════════════════════════════════════════════════════════

function qs(sel, ctx = document) { return ctx.querySelector(sel); }

function updateCircle(svgEl, pct) {
  const fg = svgEl?.querySelector('.circle-fg');
  if (fg) fg.style.strokeDashoffset = 82 - (82 * pct / 100);
}

function refreshCardProgress(materia) {
  const pct = calcSubjectProgress(materia);
  const cardEl = document.querySelector(`[data-materia="${materia.id}"]`);
  if (!cardEl) return;

  const pctEl = cardEl.querySelector('.card-pct');
  const circEl = cardEl.querySelector('.circle-progress');
  if (pctEl) pctEl.textContent = `${pct}%`;
  if (circEl) updateCircle(circEl, pct);
}

function refreshSemesterProgress(semIdx) {
  const materias = CURRICULUM[semIdx].materias;
  const pct = calcSemesterProgress(materias);
  const fill = document.getElementById(`sem-fill-${semIdx}`);
  const pctEl = document.getElementById(`sem-pct-${semIdx}`);
  if (fill) fill.style.width = `${pct}%`;
  if (pctEl) pctEl.textContent = `${pct}%`;
}

function refreshGlobal() {
  const pct = calcGlobalProgress();
  const el = document.getElementById('global-pct');
  if (el) el.textContent = `${pct}% global`;
}

// ═══════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════

function renderTemario(temario) {
  return temario.map(t => `
    <div class="tema-item">
      <div class="tema-head">
        <span class="tema-num">${t.num}</span>
        <span class="tema-name">${t.name}</span>
      </div>
      ${t.subtemas.map(s => `<div class="subtema">${s}</div>`).join('')}
    </div>
  `).join('');
}

function renderBiblioteca(materia, semIdx) {
  const books = materia.bibBasicas.map((book, bi) => {
    const states = getBookProgress(materia.id, bi);
    const done   = book.caps.filter((_, ci) => states[ci] === true).length;
    const pct    = book.caps.length ? Math.round((done / book.caps.length) * 100) : 0;

    const caps = book.caps.map((cap, ci) => {
      const checked = states[ci] === true;
      return `
        <div class="chapter-item${checked ? ' read' : ''}" data-bi="${bi}" data-ci="${ci}">
          <input class="cap-check" type="checkbox" ${checked ? 'checked' : ''}
            data-materia="${materia.id}" data-bi="${bi}" data-ci="${ci}" data-semidx="${semIdx}">
          <span class="chapter-label">${cap}</span>
        </div>
      `;
    }).join('');

    return `
      <div class="book-card" data-book="${materia.id}-${bi}">
        <div class="book-header" data-toggle-book="${materia.id}-${bi}">
          <div class="book-left">
            <div class="book-dot"></div>
            <span class="book-name">${book.name}</span>
          </div>
          <div class="book-right">
            <span class="book-pct" data-book-pct="${materia.id}-${bi}">${pct}%</span>
            <svg class="book-chev" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5">
              <polyline points="3,5 7,9 11,5"/>
            </svg>
          </div>
        </div>
        <div class="book-progress">
          <div class="book-progress-fill" data-book-bar="${materia.id}-${bi}" style="width:${pct}%"></div>
        </div>
        <div class="book-body">
          <div class="chapters-list" data-caps="${materia.id}-${bi}">${caps}</div>
        </div>
      </div>
    `;
  }).join('');

  const comp = materia.bibComp.map(c => `<div class="comp-entry">${c}</div>`).join('');

  return `
    <div class="section-label">Básica</div>
    ${books}
    <div class="section-label">Complementaria</div>
    <div class="comp-section" data-comp="${materia.id}">
      <div class="comp-toggle" data-toggle-comp="${materia.id}">
        <span class="comp-title">Ver bibliografía complementaria (${materia.bibComp.length})</span>
        <svg class="comp-chev" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5">
          <polyline points="3,5 7,9 11,5"/>
        </svg>
      </div>
      <div class="comp-body">${comp}</div>
    </div>
  `;
}

function renderSubsecuentes(subsecuentes) {
  return `
    <div class="subsec-block">
      <div class="subsec-label">Materias subsecuentes</div>
      <div class="subsec-tags">
        ${subsecuentes.map(s => `<span class="subsec-tag">${s}</span>`).join('')}
      </div>
    </div>
  `;
}

function renderCard(materia, semIdx) {
  const pct = calcSubjectProgress(materia);
  const circ = `
    <svg class="circle-progress" viewBox="0 0 32 32">
      <circle class="circle-bg" cx="16" cy="16" r="13"/>
      <circle class="circle-fg" cx="16" cy="16" r="13"/>
    </svg>
  `;

  return `
    <div class="card" data-materia="${materia.id}">
      <div class="card-header" data-toggle-card="${materia.id}">
        <div class="card-icon">${materia.icon}</div>
        <div class="card-info">
          <div class="card-name">${materia.name}</div>
          <div class="card-meta">
            <span class="meta-tag"><strong>Clave</strong> ${materia.clave}</span>
            <span class="meta-tag"><strong>${materia.creditos}</strong> créditos</span>
          </div>
        </div>
        <div class="card-controls">
          ${circ}
          <svg class="chevron" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="5,7 10,13 15,7"/>
          </svg>
        </div>
      </div>
      <div class="card-body">
        <div class="tabs">
          <div class="tab active" data-tab-target="${materia.id}-temario">Temario</div>
          <div class="tab" data-tab-target="${materia.id}-biblio">Bibliografía</div>
        </div>
        <div class="tab-panel active" id="${materia.id}-temario">
          ${renderTemario(materia.temario)}
        </div>
        <div class="tab-panel" id="${materia.id}-biblio">
          ${renderBiblioteca(materia, semIdx)}
        </div>
        ${renderSubsecuentes(materia.subsecuentes)}
      </div>
    </div>
  `;
}

function renderSemester(sem, idx) {
  const pct = calcSemesterProgress(sem.materias);
  const cardsHtml = sem.materias.length
    ? sem.materias.map(m => renderCard(m, idx)).join('')
    : `<div class="empty-semester">Sin materias registradas en este semestre</div>`;

  return `
    <section class="semester-section">
      <div class="semester-header">
        <h2 class="semester-title">${sem.titulo}</h2>
        <span class="semester-credits">${sem.creditos}</span>
      </div>
      <div class="semester-progress-wrap">
        <div class="semester-bar-track">
          <div class="semester-bar-fill" id="sem-fill-${idx}" style="width:${pct}%"></div>
        </div>
        <span class="semester-pct" id="sem-pct-${idx}">${pct}%</span>
      </div>
      <div class="subjects-grid">${cardsHtml}</div>
    </section>
  `;
}

function renderAll() {
  const root = document.getElementById('root');
  root.innerHTML = CURRICULUM.map((sem, i) => renderSemester(sem, i)).join('');

  // Paint circles after DOM is ready
  CURRICULUM.forEach(sem => {
    sem.materias.forEach(m => {
      const pct = calcSubjectProgress(m);
      const cardEl = document.querySelector(`[data-materia="${m.id}"]`);
      if (cardEl) updateCircle(cardEl.querySelector('.circle-progress'), pct);
    });
  });

  refreshGlobal();
}

// ═══════════════════════════════════════════════════════════
// EVENT DELEGATION
// ═══════════════════════════════════════════════════════════

document.getElementById('root').addEventListener('click', e => {
  // Toggle card
  const cardToggle = e.target.closest('[data-toggle-card]');
  if (cardToggle) {
    const id = cardToggle.dataset.toggleCard;
    const card = document.querySelector(`[data-materia="${id}"]`);
    if (card) card.classList.toggle('open');
    return;
  }

  // Toggle book
  const bookToggle = e.target.closest('[data-toggle-book]');
  if (bookToggle) {
    const id = bookToggle.dataset.toggleBook;
    const book = document.querySelector(`[data-book="${id}"]`);
    if (book) book.classList.toggle('open');
    return;
  }

  // Toggle comp
  const compToggle = e.target.closest('[data-toggle-comp]');
  if (compToggle) {
    const id = compToggle.dataset.toggleComp;
    const comp = document.querySelector(`[data-comp="${id}"]`);
    if (comp) comp.classList.toggle('open');
    return;
  }

  // Tab switch
  const tab = e.target.closest('[data-tab-target]');
  if (tab) {
    const targetId = tab.dataset.tabTarget;
    const tabsContainer = tab.closest('.tabs');
    tabsContainer.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');

    // Find sibling panels
    const panels = tab.closest('.card-body').querySelectorAll('.tab-panel');
    panels.forEach(p => {
      p.classList.toggle('active', p.id === targetId);
    });
    return;
  }
});

// Chapter checkbox change
document.getElementById('root').addEventListener('change', e => {
  const chk = e.target.closest('.cap-check');
  if (!chk) return;

  const { materia: materiaId, bi, ci, semidx } = chk.dataset;
  const biInt = parseInt(bi), ciInt = parseInt(ci), semInt = parseInt(semidx);

  // Update DOM immediately
  const chapterItem = chk.closest('.chapter-item');
  chapterItem.classList.toggle('read', chk.checked);

  // Read all checks in this book
  const capsContainer = document.querySelector(`[data-caps="${materiaId}-${biInt}"]`);
  const allChecks = capsContainer.querySelectorAll('.cap-check');
  const states = Array.from(allChecks).map(c => c.checked);

  // Save
  setBookProgress(materiaId, biInt, states);

  // Update book badge + bar
  const done = states.filter(Boolean).length;
  const pct  = Math.round((done / states.length) * 100);
  const pctEl = document.querySelector(`[data-book-pct="${materiaId}-${biInt}"]`);
  const barEl = document.querySelector(`[data-book-bar="${materiaId}-${biInt}"]`);
  if (pctEl) pctEl.textContent = `${pct}%`;
  if (barEl) barEl.style.width = `${pct}%`;

  // Find materia
  const materia = CURRICULUM.flatMap(s => s.materias).find(m => m.id === materiaId);
  if (!materia) return;

  refreshCardProgress(materia);
  refreshSemesterProgress(semInt);
  refreshGlobal();
});

renderAll();
