<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Matemáticas · UNAM</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
--bg: #000;
--s1: #080d0c;
--s2: #0d1512;
--s3: #121c18;
--border: rgba(100, 220, 200, 0.08);
--border2: rgba(100, 220, 200, 0.16);
--ink: #e8f5f2;
--ink2: rgba(232, 245, 242, 0.55);
--ink3: rgba(232, 245, 242, 0.28);
--gold: #a2e6db;
--gold2: #93e8d8;
--gold-dim: rgba(94, 207, 190, 0.14);
--teal: #a8f0e2;
--teal-dim: rgba(168, 240, 226, 0.12);
--r: 20px;
--r2: 12px;
--ease: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

* {
box-sizing: border-box;
margin: 0;
padding: 0;
}

html {
scroll-behavior: smooth;
}

body {
font-family: 'DM Sans', system-ui, sans-serif;
background: var(--bg);
color: var(--ink);
min-height: 100vh;
-webkit-font-smoothing: antialiased;
padding-bottom: 4rem;
position: relative;
overflow-x: hidden;
}

.header {
position: sticky;
top: 0;
z-index: 200;
padding: 1.1rem 1.5rem 0.9rem;
display: flex;
align-items: center;
justify-content: space-between;
gap: 1rem;
background: rgba(0, 0, 0, 0.85);
backdrop-filter: blur(20px) saturate(150%);
border-bottom: 1px solid var(--border);
}

.header::after {
content: '';
position: absolute;
bottom: 0;
left: 5%;
right: 5%;
height: 1px;
background: linear-gradient(90deg, transparent, var(--gold), transparent);
opacity: 0.3;
}

.header-left {
display: flex;
align-items: center;
gap: 0.8rem;
}

.header-logo {
font-family: 'Playfair Display', serif;
font-size: 1.5rem;
font-weight: 900;
color: var(--ink);
line-height: 1;
letter-spacing: -0.02em;
flex-shrink: 0;
align-self: center;
}

.header-divider {
width: 1px;
background: rgba(232, 245, 242, 0.15);
align-self: stretch;
flex-shrink: 0;
}

.header-title {
font-family: 'Playfair Display', serif;
font-size: 1.35rem;
font-weight: 900;
color: var(--ink);
letter-spacing: -0.01em;
line-height: 1.1;
}

.header-sub {
font-size: 10px;
letter-spacing: 0.16em;
text-transform: uppercase;
color: var(--ink3);
margin-top: 3px;
font-weight: 500;
}

.global-badge {
font-family: 'DM Mono', monospace;
font-size: 13px;
font-weight: 500;
padding: 6px 16px;
border-radius: 99px;
border: 1px solid rgba(94, 207, 190, 0.35);
background: rgba(94, 207, 190, 0.08);
color: var(--gold2);
white-space: nowrap;
letter-spacing: 0.04em;
}

.container {
max-width: 600px;
margin: 0 auto;
padding: 0 1.2rem;
}

.semester {
margin-top: 2.5rem;
}

.sem-header {
display: flex;
align-items: baseline;
justify-content: space-between;
margin-bottom: 0.5rem;
padding: 0 0.2rem;
}

.sem-title {
font-family: 'Playfair Display', serif;
font-size: 0.78rem;
font-weight: 700;
letter-spacing: 0.14em;
text-transform: uppercase;
color: var(--ink);
}

.sem-credits-badge {
font-family: 'DM Mono', monospace;
font-size: 9px;
color: var(--ink3);
border: 1px solid var(--border);
padding: 2px 8px;
border-radius: 99px;
letter-spacing: 0.05em;
}

.sem-prog-row {
display: flex;
align-items: center;
gap: 0.75rem;
margin-bottom: 1.1rem;
padding: 0 0.2rem;
}

.sem-bar-track {
flex: 1;
height: 2px;
background: rgba(255, 255, 255, 0.06);
border-radius: 99px;
overflow: hidden;
}

.sem-bar-fill {
height: 100%;
border-radius: 99px;
background: linear-gradient(90deg, var(--gold), var(--gold2));
transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
width: 0%;
}

.sem-pct {
font-family: 'DM Mono', monospace;
font-size: 10px;
font-weight: 500;
color: var(--gold);
min-width: 32px;
text-align: right;
}

.sem-grid {
display: flex;
flex-direction: column;
gap: 0.9rem;
}

.card {
border-radius: var(--r);
background: rgba(255, 255, 255, 0.035);
border: 1px solid var(--border);
backdrop-filter: blur(16px);
box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
overflow: hidden;
transition: border-color var(--ease), box-shadow var(--ease);
}

.card:hover {
border-color: rgba(255, 255, 255, 0.12);
box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
}

.card.open {
border-color: rgba(94, 207, 190, 0.2);
box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(94, 207, 190, 0.06) inset;
}

.card-head {
display: flex;
align-items: center;
gap: 0.9rem;
padding: 0.95rem 1rem;
cursor: pointer;
user-select: none;
min-height: 70px;
}

.card-icon {
width: 44px;
height: 44px;
background: transparent;
border: 0;
display: flex;
align-items: center;
justify-content: center;
flex-shrink: 0;
overflow: hidden;
}

.card-icon img {
width: 100%;
height: 100%;
object-fit: cover;
}

.card-info {
flex: 1;
min-width: 0;
}

.card-name {
font-family: 'Playfair Display', serif;
font-size: 0.98rem;
font-weight: 700;
color: var(--ink);
line-height: 1.3;
}

.card-meta {
display: flex;
flex-wrap: wrap;
gap: 0.3rem;
margin-top: 0.4rem;
}

.meta-pill {
font-family: 'DM Mono', monospace;
font-size: 9px;
background: rgba(255, 255, 255, 0.05);
border: 1px solid var(--border);
padding: 2px 8px;
border-radius: 99px;
color: var(--ink3);
letter-spacing: 0.04em;
}

.meta-pill b {
color: var(--ink2);
font-weight: 500;
}

.circ-wrap {
position: relative;
width: 46px;
height: 46px;
flex-shrink: 0;
}

.circ-svg {
width: 46px;
height: 46px;
display: block;
}

.circ-bg {
fill: none;
stroke: rgba(255, 255, 255, 0.07);
stroke-width: 3;
}

.circ-fg {
fill: none;
stroke: var(--gold);
stroke-width: 3;
stroke-linecap: round;
stroke-dasharray: 107;
stroke-dashoffset: 107;
transform: rotate(-90deg);
transform-origin: 50% 50%;
transition: stroke-dashoffset 0.5s ease;
}

.circ-num {
position: absolute;
inset: 0;
display: flex;
align-items: center;
justify-content: center;
font-family: 'DM Mono', monospace;
font-size: 10px;
font-weight: 500;
color: var(--teal);
pointer-events: none;
}

.chevron {
width: 18px;
height: 18px;
color: var(--ink3);
transition: transform var(--ease), color var(--ease);
flex-shrink: 0;
}

.card.open .chevron {
transform: rotate(180deg);
color: var(--gold);
}

.card-body {
max-height: 0;
overflow: hidden;
transition: max-height 0.55s cubic-bezier(0.2, 1, 0.4, 1);
}

.card.open .card-body {
max-height: 9999px;
}

.tabs {
display: flex;
background: rgba(0, 0, 0, 0.3);
border-top: 1px solid var(--border);
border-bottom: 1px solid var(--border);
padding: 0 1rem;
gap: 0.25rem;
}

.tab {
font-size: 11.5px;
font-weight: 600;
padding: 0.7rem 0.8rem;
cursor: pointer;
color: var(--ink3);
border-bottom: 2px solid transparent;
letter-spacing: 0.04em;
text-transform: uppercase;
transition: all var(--ease);
white-space: nowrap;
}

.tab.active {
color: var(--gold);
border-bottom-color: var(--gold);
}

.tab-panel {
display: none;
padding: 1rem;
}

.tab-panel.active {
display: block;
}

.tema-item {
border: 1px solid var(--border);
border-radius: var(--r2);
overflow: hidden;
margin-bottom: 0.65rem;
background: rgba(255, 255, 255, 0.018);
}

.tema-head {
display: flex;
align-items: flex-start;
gap: 0.7rem;
padding: 0.75rem 0.9rem;
cursor: default;
background: rgba(255, 255, 255, 0.03);
}

.tema-item.done .tema-head {
cursor: pointer;
background: rgba(91, 191, 181, 0.04);
}

.tema-head-left {
flex: 1;
display: flex;
gap: 0.6rem;
align-items: flex-start;
}

.tema-num {
font-family: 'DM Mono', monospace;
font-size: 9px;
font-weight: 500;
background: rgba(94, 207, 190, 0.12);
border: 1px solid rgba(94, 207, 190, 0.25);
padding: 2px 7px;
border-radius: 6px;
color: var(--gold);
flex-shrink: 0;
margin-top: 1px;
letter-spacing: 0.05em;
}

.tema-name {
font-size: 13.5px;
font-weight: 600;
color: var(--ink);
line-height: 1.35;
}

.tema-meta {
display: flex;
align-items: center;
gap: 0.5rem;
flex-shrink: 0;
}

.tema-hrs-badge {
font-family: 'DM Mono', monospace;
font-size: 9px;
color: var(--ink3);
white-space: nowrap;
}

.tema-chev {
width: 14px;
height: 14px;
color: var(--ink3);
transition: transform 0.2s, opacity 0.2s;
flex-shrink: 0;
opacity: 0;
pointer-events: none;
}

.tema-item.done .tema-chev {
opacity: 1;
}

.tema-item.done.collapsed .tema-chev {
transform: rotate(-90deg);
}

.tema-checkbox {
width: 22px;
height: 22px;
border-radius: 6px;
border: 2px solid var(--border2);
background: transparent;
cursor: pointer;
appearance: none;
position: relative;
transition: all 0.2s;
flex-shrink: 0;
}

.tema-checkbox:checked {
background: var(--gold);
border-color: var(--gold);
}

.tema-checkbox:checked::after {
content: '';
position: absolute;
width: 5px;
height: 9px;
border: 2px solid #000;
border-top: none;
border-left: none;
transform: rotate(45deg);
left: 5px;
top: 1px;
}

.tema-item.done .tema-name {
text-decoration: line-through;
text-decoration-thickness: 1px;
color: var(--ink3);
}

.tema-subtemas {
overflow: hidden;
max-height: 9999px;
transition: max-height 0.35s cubic-bezier(0.2, 1, 0.4, 1);
}

.tema-item.collapsed .tema-subtemas {
max-height: 0;
}

.subtema {
font-size: 12.5px;
color: var(--ink3);
padding: 0.5rem 0.9rem;
border-top: 1px solid var(--border);
line-height: 1.55;
display: flex;
gap: 0.5rem;
}

.subtema::before {
content: "›";
color: var(--gold);
flex-shrink: 0;
font-size: 14px;
line-height: 1.4;
}

.sec-label {
font-size: 9px;
font-weight: 700;
letter-spacing: 0.18em;
text-transform: uppercase;
color: var(--ink3);
margin: 1rem 0 0.6rem;
display: flex;
align-items: center;
gap: 0.6rem;
padding: 0.75rem 1rem 0;
}

.sec-label:first-child {
padding-top: 0.75rem;
margin-top: 0;
}

.sec-label::after {
content: '';
flex: 1;
height: 1px;
background: var(--border);
}

.book-card {
border: 1px solid var(--border);
border-radius: var(--r2);
overflow: hidden;
margin-bottom: 0.65rem;
}

.book-head {
display: flex;
align-items: flex-start;
gap: 0.6rem;
padding: 0.7rem 0.9rem;
cursor: pointer;
background: rgba(255, 255, 255, 0.025);
}

.book-dot {
width: 6px;
height: 6px;
border-radius: 50%;
background: var(--teal);
flex-shrink: 0;
margin-top: 0.4rem;
}

.book-name {
font-size: 11.5px;
color: var(--ink2);
line-height: 1.5;
font-weight: 400;
flex: 1;
}

.book-right {
display: flex;
align-items: center;
gap: 0.4rem;
flex-shrink: 0;
}

.book-pct-badge {
font-family: 'DM Mono', monospace;
font-size: 9px;
background: var(--teal-dim);
border: 1px solid rgba(91, 191, 181, 0.25);
padding: 2px 8px;
border-radius: 99px;
color: var(--teal);
}

.bk-chev {
width: 14px;
height: 14px;
color: var(--ink3);
transition: transform 0.2s;
flex-shrink: 0;
}

.book-card.open .bk-chev {
transform: rotate(180deg);
}

.book-prog-bar {
height: 2px;
background: rgba(91, 191, 181, 0.08);
}

.book-prog-fill {
height: 100%;
background: var(--teal);
transition: width 0.3s;
}

.book-body {
max-height: 0;
overflow: hidden;
transition: max-height 0.3s ease;
}

.book-card.open .book-body {
max-height: 600px;
}

.chapters-list {
padding: 0.5rem 0.8rem 0.8rem;
display: flex;
flex-direction: column;
gap: 3px;
}

.chap-item {
display: flex;
align-items: center;
gap: 0.7rem;
padding: 0.55rem 0.5rem;
border-radius: 8px;
transition: background 0.15s;
}

.chap-item:hover {
background: rgba(91, 191, 181, 0.05);
}

.chap-item.read {
background: rgba(91, 191, 181, 0.06);
}

.cap-check {
width: 18px;
height: 18px;
border-radius: 4px;
border: 1.5px solid var(--border2);
background: transparent;
cursor: pointer;
appearance: none;
position: relative;
transition: all 0.15s;
flex-shrink: 0;
}

.cap-check:checked {
background: var(--teal);
border-color: var(--teal);
}

.cap-check:checked::after {
content: '';
position: absolute;
width: 4px;
height: 7px;
border: 1.5px solid #000;
border-top: none;
border-left: none;
transform: rotate(45deg);
left: 4px;
top: 1px;
}

.chap-label {
font-size: 12px;
color: var(--ink3);
flex: 1;
cursor: pointer;
line-height: 1.4;
}

.chap-item.read .chap-label {
color: var(--teal);
text-decoration: line-through;
text-decoration-thickness: 1px;
opacity: 0.7;
}

.subsec-block {
margin: 0;
padding: 0.75rem 1rem 1rem;
background: rgba(94, 207, 190, 0.04);
border-top: 1px solid rgba(94, 207, 190, 0.12);
}

.subsec-label {
font-size: 9px;
font-weight: 700;
letter-spacing: 0.14em;
text-transform: uppercase;
color: var(--gold);
margin-bottom: 0.5rem;
}

.subsec-tags {
display: flex;
flex-wrap: wrap;
gap: 0.35rem;
}

.subsec-tag {
font-size: 11px;
background: rgba(94, 207, 190, 0.07);
border: 1px solid rgba(94, 207, 190, 0.2);
padding: 4px 10px;
border-radius: 99px;
color: var(--gold);
cursor: pointer;
transition: all 0.2s;
display: flex;
align-items: center;
gap: 4px;
}

.subsec-tag:hover {
background: rgba(94, 207, 190, 0.15);
border-color: rgba(94, 207, 190, 0.4);
}

.subsec-tag-arrow {
font-size: 9px;
opacity: 0.6;
}

.subsec-tag.no-link {
cursor: default;
opacity: 0.5;
}

.subsec-tag.no-link:hover {
background: rgba(94, 207, 190, 0.07);
border-color: rgba(94, 207, 190, 0.2);
}

.empty-card {
padding: 2rem;
text-align: center;
color: var(--ink3);
border: 1px dashed var(--border);
border-radius: var(--r);
font-size: 12px;
letter-spacing: 0.06em;
font-family: 'DM Mono', monospace;
}

.card.highlight-pulse {
animation: pulseBorder 1.5s ease forwards;
}

/* BIBLIOGRAFÍA COMPLEMENTARIA */
.comp-section {
border-top: 1px solid var(--border);
}

.comp-toggle {
display: flex;
align-items: center;
justify-content: space-between;
padding: 0.7rem 1rem;
cursor: pointer;
background: rgba(255, 255, 255, 0.02);
transition: background var(--ease);
}

.comp-toggle:hover {
background: rgba(255, 255, 255, 0.05);
}

.comp-title {
font-size: 9px;
font-weight: 700;
letter-spacing: 0.18em;
text-transform: uppercase;
color: var(--ink3);
}

.comp-chev {
color: var(--ink3);
transition: transform 0.25s;
flex-shrink: 0;
}

.comp-section.open .comp-chev {
transform: rotate(180deg);
}

.comp-body {
max-height: 0;
overflow: hidden;
transition: max-height 0.35s cubic-bezier(0.2, 1, 0.4, 1);
}

.comp-section.open .comp-body {
max-height: 2000px;
}

.comp-entry {
font-size: 11.5px;
color: var(--ink3);
padding: 0.5rem 1rem;
border-top: 1px solid var(--border);
line-height: 1.55;
}

.comp-entry:first-child {
border-top: none;
}

@keyframes pulseBorder {
0% {
border-color: rgba(94, 207, 190, 0.6);
box-shadow: 0 0 0 4px rgba(94, 207, 190, 0.15);
}

100% {
border-color: rgba(94, 207, 190, 0.2);
box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
}
}

/* FIX 1: margin-top para separar de cards anteriores */
.add-optativa-btn {
display: flex;
align-items: center;
justify-content: center;
gap: 0.55rem;
width: 100%;
padding: 0.75rem 1rem;
border-radius: var(--r);
border: 1px dashed rgba(94, 207, 190, 0.2);
background: rgba(94, 207, 190, 0.03);
color: var(--ink3);
cursor: pointer;
font-family: 'DM Sans', sans-serif;
font-size: 12px;
font-weight: 500;
letter-spacing: 0.04em;
transition: all 0.2s;
margin-top: 0.9rem;
}

.add-optativa-btn:hover {
border-color: rgba(94, 207, 190, 0.4);
background: rgba(94, 207, 190, 0.07);
color: var(--gold);
}

.add-optativa-btn svg {
flex-shrink: 0;
transition: transform 0.25s;
}

.add-optativa-btn.open svg {
transform: rotate(180deg);
}

.add-optativa-btn.open {
border-color: rgba(94, 207, 190, 0.35);
background: rgba(94, 207, 190, 0.06);
color: var(--gold);
}

.opt-carousel-wrap {
overflow: hidden;
max-height: 0;
transition: max-height 0.45s cubic-bezier(0.2, 1, 0.4, 1);
}

.opt-carousel-wrap.open {
max-height: 2000px;
}

.opt-carousel-viewport {
height: 220px;
overflow-y: auto;
position: relative;
border: 1px solid var(--border);
background: rgba(0, 0, 0, 0.25);
scroll-snap-type: y mandatory;
scroll-behavior: smooth;
scrollbar-width: thin;
scrollbar-color: rgba(94, 207, 190, 0.3) transparent;
padding: 10px 0;
}

.opt-carousel-viewport::-webkit-scrollbar {
width: 6px;
}

.opt-carousel-viewport::-webkit-scrollbar-track {
background: rgba(255, 255, 255, 0.03);
border-radius: 99px;
margin: 15px 0;
}

.opt-carousel-viewport::-webkit-scrollbar-thumb {
background: rgba(94, 207, 190, 0.3);
border-radius: 99px;
cursor: pointer;
}

.opt-carousel-viewport::-webkit-scrollbar-thumb:hover {
background: rgba(94, 207, 190, 0.5);
}

/* Fade overlays handled by .opt-carousel-inner wrapper */

.opt-carousel-inner {
position: relative;
border-radius: var(--r2);
overflow: hidden;
}

.opt-carousel-inner::before,
.opt-carousel-inner::after {
content: '';
position: absolute;
left: 0;
right: 0;
height: 32px;
z-index: 3;
pointer-events: none;
}

.opt-carousel-inner::before {
top: 0;
background: linear-gradient(to bottom, rgba(0, 0, 0, 0.75), transparent);
border-radius: var(--r2) var(--r2) 0 0;
}

.opt-carousel-inner::after {
bottom: 0;
background: linear-gradient(to top, rgba(0, 0, 0, 0.75), transparent);
border-radius: 0 0 var(--r2) var(--r2);
}

.opt-carousel-list {
display: flex;
flex-direction: column;
padding: 5px 0;
}

.opt-item {
display: flex;
align-items: center;
gap: 0.9rem;
padding: 0.55rem 1rem;
height: 70px;
min-height: 70px;
cursor: pointer;
border-bottom: 1px solid var(--border);
transition: background 0.15s;
flex-shrink: 0;
user-select: none;
scroll-snap-align: center;
}

.opt-item:last-child {
border-bottom: none;
}

.opt-item:hover {
background: rgba(94, 207, 190, 0.05);
}

.opt-item.selected {
background: rgba(94, 207, 190, 0.12);
border-left: 3px solid var(--gold);
position: relative;
}

.opt-item.selected::after {
content: '✓';
position: absolute;
right: 15px;
color: var(--gold);
font-size: 16px;
font-weight: bold;
}

.opt-item-icon {
width: 44px;
height: 44px;
border-radius: var(--r2);
background: rgba(96, 94, 207, 0.07);
border: 1px solid var(--border2);
display: flex;
align-items: center;
justify-content: center;
flex-shrink: 0;
font-family: 'Playfair Display', serif;
font-size: 1.05rem;
font-weight: 900;
color: var(--gold);
letter-spacing: -0.02em;
}

.opt-item-info {
flex: 1;
min-width: 0;
}

.opt-item-name {
font-family: 'Playfair Display', serif;
font-size: 0.93rem;
font-weight: 700;
color: var(--ink);
line-height: 1.3;
white-space: nowrap;

const SK_TEMA = 'mat_tema_v1',
  SK_BOOK = 'mat_book_v1',
  SK_COLLAPSED = 'mat_collapsed_v1',
  SK_OPTATIVAS = 'mat_optativas_v1';

function loadDB(k) {
  try {
    return JSON.parse(localStorage.getItem(k) || '{}')
  } catch {
    return {}
  }
}

function saveDB(k, d) {
  localStorage.setItem(k, JSON.stringify(d))
}
let temaDB = loadDB(SK_TEMA),
  bookDB = loadDB(SK_BOOK),
  collapsedDB = loadDB(SK_COLLAPSED),
  optDB = loadDB(SK_OPTATIVAS);

function getTemaDone(m, i) {
  return temaDB[`${m}_${i}`] === true
}

function setTemaDone(m, i, v) {
  temaDB[`${m}_${i}`] = v;
  saveDB(SK_TEMA, temaDB)
}

function getBookCaps(m, b) {
  return bookDB[`${m}_${b}`] || []
}

function setBookCaps(m, b, a) {
  bookDB[`${m}_${b}`] = a;
  saveDB(SK_BOOK, bookDB)
}

function getTemaCollapsed(m, i) {
  return collapsedDB[`${m}_${i}`] === true
}

function setTemaCollapsed(m, i, v) {
  collapsedDB[`${m}_${i}`] = v;
  saveDB(SK_COLLAPSED, collapsedDB)
}

function getOptSlot(sem, slot) {
  return optDB[`${sem}_${slot}`] || null
}

function setOptSlot(sem, slot, opt) {
  optDB[`${sem}_${slot}`] = opt;
  saveDB(SK_OPTATIVAS, optDB)
}

function clearOptSlot(sem, slot) {
  delete optDB[`${sem}_${slot}`];
  saveDB(SK_OPTATIVAS, optDB)
}

function getAllChosenOptNames() {
  return Object.values(optDB).filter(Boolean).map(o => o.name)
}

function getMateriaProgress(mat) {
  let t = 0,
    d = 0;
  (mat.temario || []).forEach((tema, i) => {
    const h = tema.horas || ((tema.subtemas || []).length * 2);
    t += h;
    if (getTemaDone(mat.id, i)) d += h;
  });
  return t === 0 ? 0 : Math.min(100, Math.round(d / t * 100));
}

function isComplete(mat) {
  return getMateriaProgress(mat) === 100
}

function getGlobalPct() {
  const allMats = CURRICULUM.flatMap(s => s.materias);
  const done = allMats.filter(m => isComplete(m)).reduce((s, m) => s + m.creditos, 0);
  return Math.min(100, Math.round(done / TOTAL_CREDITOS * 100));
}

function getSemPct(sem) {
  const tc = sem.materias.reduce((s, m) => s + m.creditos, 0);
  if (!tc) return 0;
  const dc = sem.materias.filter(m => isComplete(m)).reduce((s, m) => s + m.creditos, 0);
  return Math.min(100, Math.round(dc / tc * 100));
}

function buildMateriaId(id) {
  return `card-${id}`
}

function renderTemario(mat) {
  if (!mat.temario || !mat.temario.length) return '<div style="padding:1rem;color:var(--ink3);font-size:12px;">Temario en construcción</div>';
  return mat.temario.map((t, i) => {
    const done = getTemaDone(mat.id, i);
    const collapsed = done && getTemaCollapsed(mat.id, i);
    const h = t.horas || ((t.subtemas || []).length * 2);
    const subs = (t.subtemas || []).map(s => `<div class="subtema">${s}</div>`).join('');
    return `<div class="tema-item ${done?'done':''} ${collapsed?'collapsed':''}" id="tema-${mat.id}-${i}"><div class="tema-head" data-tema-toggle="${mat.id}-${i}"><div class="tema-head-left"><span class="tema-num">${t.num}</span><span class="tema-name">${t.name}</span></div><div class="tema-meta"><span class="tema-hrs-badge">${h}h</span><svg class="tema-chev" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="3,5 7,9 11,5"/></svg><input class="tema-checkbox" type="checkbox" ${done?'checked':''} data-tema-check="${mat.id}" data-tema-idx="${i}" onclick="event.stopPropagation()"></div></div><div class="tema-subtemas">${subs}</div></div>`;
  }).join('');
}

function renderBiblio(mat) {
  const books = (mat.bibBasicas || []).map((bk, bi) => {
    const caps = getBookCaps(mat.id, bi);
    const done = caps.filter(Boolean).length;
    const pct = bk.caps.length ? Math.round(done / bk.caps.length * 100) : 0;
    const chaps = bk.caps.map((c, ci) => {
      const checked = caps[ci] === true;
      return `<div class="chap-item ${checked?'read':''}"><input class="cap-check" type="checkbox" ${checked?'checked':''} data-mid="${mat.id}" data-bi="${bi}" data-ci="${ci}"><span class="chap-label">${c}</span></div>`;
    }).join('');
    return `<div class="book-card" data-book="${mat.id}-${bi}"><div class="book-head" data-toggle-book="${mat.id}-${bi}"><div class="book-dot"></div><span class="book-name">${bk.name}</span><div class="book-right"><span class="book-pct-badge" data-book-pct="${mat.id}-${bi}">${pct}%</span><svg class="bk-chev" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="3,5 7,9 11,5"/></svg></div></div><div class="book-prog-bar"><div class="book-prog-fill" data-book-bar="${mat.id}-${bi}" style="width:${pct}%"></div></div><div class="book-body"><div class="chapters-list" data-caps="${mat.id}-${bi}">${chaps}</div></div></div>`;
  }).join('');
  const comp = (mat.bibComp || []).map(c => `<div class="comp-entry">${c}</div>`).join('') || '<div class="comp-entry">Sin referencias complementarias</div>';
  return `<div class="sec-label">Bibliografía Básica</div><div style="padding:0 1rem">${books}</div><div class="comp-section" style="margin:0;border-radius:0;border-left:none;border-right:none;border-bottom:none" data-comp="${mat.id}"><div class="comp-toggle" data-toggle-comp="${mat.id}"><span class="comp-title">Complementaria · ${mat.bibComp?.length||0}</span><svg class="comp-chev" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" width="14" height="14"><polyline points="3,5 7,9 11,5"/></svg></div><div class="comp-body">${comp}</div></div>`;
}

function renderSubsecuentes(mat) {
  const tags = (mat.subsecuentes || []).map(name => {
    const found = CURRICULUM.flatMap(s => s.materias).find(m => m.name === name);
    if (found) return `<span class="subsec-tag" data-nav="${found.id}">${name} <span class="subsec-tag-arrow">↗</span></span>`;
    return `<span class="subsec-tag no-link">${name}</span>`;
  }).join('');
  return `<div class="subsec-block"><div class="subsec-label">Materias Subsecuentes</div><div class="subsec-tags">${tags||'<span class="subsec-tag no-link">—</span>'}</div></div>`;
}

function renderCard(mat) {
  const pct = getMateriaProgress(mat);
  const offset = 107 - (107 * pct / 100);
  return `<div class="card" id="${buildMateriaId(mat.id)}" data-materia="${mat.id}"><div class="card-head" data-toggle-card="${mat.id}"><div class="card-icon"><img src="${mat.icon||'https://img.icons8.com/fluency/48/book.png'}" alt="${mat.name}" onerror="this.src='https://img.icons8.com/fluency/48/book.png'"></div><div class="card-info"><div class="card-name">${mat.name}</div><div class="card-meta"><span class="meta-pill">Clave <b>${mat.clave}</b></span><span class="meta-pill"><b>${mat.creditos}</b> créditos</span></div></div><div style="display:flex;align-items:center;gap:0.5rem;flex-shrink:0;"><div class="circ-wrap"><svg class="circ-svg" viewBox="0 0 46 46"><circle class="circ-bg" cx="23" cy="23" r="17"/><circle class="circ-fg" cx="23" cy="23" r="17" style="stroke-dashoffset:${offset}"/></svg><span class="circ-num">${pct}%</span></div><svg class="chevron" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><polyline points="5,7 10,13 15,7"/></svg></div></div><div class="card-body"><div class="tabs"><div class="tab active" data-tab-target="${mat.id}-temario">Temario</div><div class="tab" data-tab-target="${mat.id}-biblio">Bibliografía</div></div><div class="tab-panel active" id="${mat.id}-temario">${renderTemario(mat)}</div><div class="tab-panel" id="${mat.id}-biblio" style="padding:0">${renderBiblio(mat)}</div>${renderSubsecuentes(mat)}</div></div>`;
}

const carouselState = {};

function getCarousel(sem) {
  if (!carouselState[sem]) carouselState[sem] = {
    open: false,
    selectedIdx: 0
  };
  return carouselState[sem];
}

function getAvailableOpts(sem) {
  const pool = getOptativasPool(sem);
  const allChosen = getAllChosenOptNames();
  const thisSemChosen = [];
  const semObj = CURRICULUM.find(s => s.semestre === sem);
  if (semObj) {
    for (let i = 0; i < (semObj.optativas || 0); i++) {
      const s = getOptSlot(sem, i);
      if (s) thisSemChosen.push(s.name);
    }
  }
  return pool.filter(o => {
    if (!allChosen.includes(o.name)) return true;
    return thisSemChosen.includes(o.name);
  });
}

function renderOptativaCarousel(sem) {
  const cs = getCarousel(sem);
  const available = getAvailableOpts(sem);
  const total = available.length;
  const itemsHtml = available.map((o, i) => {
    const mono = o.name.split(' ').slice(0, 2).map(w => w[0]).join('').toUpperCase().slice(0, 2);
    const iconContent = o.icon
      ? `<img src="${o.icon}" alt="${o.name}" style="width:100%;height:100%;object-fit:cover;border-radius:var(--r2);" onerror="this.style.display='none';this.nextSibling.style.display='flex'">`
        + `<span style="display:none;width:100%;height:100%;align-items:center;justify-content:center;">${mono}</span>`
      : mono;
    return `<div class="opt-item${i===cs.selectedIdx?' selected':''}" data-opt-item="${sem}-${i}"><div class="opt-item-icon" style="overflow:hidden;">${iconContent}</div><div class="opt-item-info"><div class="opt-item-name">${o.name}</div><div class="opt-item-meta"><span class="meta-pill">Optativa</span><span class="meta-pill"><b>${o.creditos}</b> créditos</span></div></div></div>`;
  }).join('');
  const hint = total ? `<span class="opt-carousel-pos" id="opt-pos-${sem}">${total} opciones · toca para seleccionar</span>` : '';
  return `<div class="opt-carousel-wrap${cs.open?' open':''}" id="opt-carousel-${sem}"><div class="opt-carousel-inner"><div class="opt-carousel-viewport" id="opt-vp-${sem}"><div class="opt-carousel-list" id="opt-list-${sem}">${total?itemsHtml:'<div style="padding:1.5rem;text-align:center;color:var(--ink3);font-size:12px;">Sin opciones disponibles</div>'}</div></div><div class="opt-carousel-footer">${hint}</div></div></div>`;
}

function renderOptativaSlot(sem, slot) {
  const chosen = getOptSlot(sem, slot);
  if (!chosen) return '';

  // Enrich with known academic data (icon already on chosen from pool)
  const enriched = enrichOptativa(chosen);
  const mono = enriched.name.split(' ').slice(0, 2).map(w => w[0]).join('').toUpperCase().slice(0, 2);
  const mat = {
    id: `opt_${sem}_${slot}`,
    name: enriched.name,
    clave: 'OPT',
    creditos: enriched.creditos,
    _optMono: mono,
    temario: enriched.temario || [],
    bibBasicas: enriched.bibBasicas || [],
    bibComp: enriched.bibComp || [],
    subsecuentes: enriched.subsecuentes || []
  };

  const pct = getMateriaProgress(mat);
  const offset = 107 - (107 * pct / 100);

  // Build icon html (initials box instead of img)
  const iconHtml = enriched.icon
    ? `<div style="width:44px;height:44px;border-radius:0;overflow:hidden;flex-shrink:0;border:0;"><img src="${enriched.icon}" alt="${enriched.name}" style="width:100%;height:100%;object-fit:cover;" onerror="this.parentElement.innerHTML='<span style=\'display:flex;width:100%;height:100%;align-items:center;justify-content:center;background:rgba(94,207,190,0.07);font-family:Playfair Display,serif;font-size:1.05rem;font-weight:900;color:var(--gold);\'>${mono}</span>'"></div>`
    : `<div style="width:44px;height:44px;background:rgba(94,207,190,0.07);border:0;border-radius:0;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:1.05rem;font-weight:900;color:var(--gold);flex-shrink:0;">${mono}</div>`;
  // Reuse existing render helpers
  const temarioHtml = renderTemario(mat);
  const biblioHtml = renderBiblio(mat);
  const subsecHtml = renderSubsecuentes(mat);

  // Change/remove row appended at bottom of card-body
  const changeRow = `<div class="opt-change-row"><button class="opt-change-btn" data-opt-remove="${sem}-${slot}">Cambiar / Eliminar</button></div>`;

  return `<div class="card" id="${buildMateriaId(mat.id)}" data-materia="${mat.id}">
    <div class="card-head" data-toggle-card="${mat.id}">
      ${iconHtml}
      <div class="card-info">
        <div class="card-name">${mat.name}</div>
        <div class="card-meta">
          <span class="meta-pill">Optativa</span>
          <span class="meta-pill"><b>${mat.creditos}</b> créditos</span>
        </div>

          <svg class="circ-svg" viewBox="0 0 46 46">
            <circle class="circ-bg" cx="23" cy="23" r="17"/>

          <span class="circ-num">${pct}%</span>

          <polyline points="5,7 10,13 15,7"/>
        </svg>
      </div>

    <div class="card-body">
      <div class="tabs">
        <div class="tab active" data-tab-target="${mat.id}-temario">Temario</div>
        <div class="tab" data-tab-target="${mat.id}-biblio">Bibliografía</div>
      </div>

      <div class="tab-panel" id="${mat.id}-biblio" style="padding:0">${biblioHtml}</div>

}

function renderSemester(sem, idx) {
  const pct = getSemPct(sem);
  const tc = sem.materias.reduce((s, m) => s + m.creditos, 0);
  const optCount = sem.optativas || 0;
  const chosenCards = [];
  for (let i = 0; i < optCount; i++) {
    chosenCards.push(renderOptativaSlot(sem.semestre, i));
  }
  const filledCount = chosenCards.filter(c => c).length;
  const remainingSlots = optCount - filledCount;
  let addSection = '';
  if (remainingSlots > 0) {
    const cs = getCarousel(sem.semestre);
    addSection = `<button class="add-optativa-btn${cs.open?' open':''}" data-toggle-carousel="${sem.semestre}"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="3,5 7,9 11,5"/></svg>Añadir optativa · ${remainingSlots} slot${remainingSlots>1?'s':''} disponible${remainingSlots>1?'s':''}</button>${renderOptativaCarousel(sem.semestre)}`;
  }
  let content = '';
  if (sem.materias.length || optCount) {
    const cards = sem.materias.map(renderCard).join('');
    content = `<div class="sem-grid">${cards}${chosenCards.join('')}</div>${addSection}`;
  } else {
    content = `<div class="empty-card">· · · por cursar · · ·</div>`;
  }
  const totalCreditos = tc + optCount * 10;
  return `<section class="semester" id="semester-${sem.semestre}"><div class="sem-header"><span class="sem-title">${sem.titulo}</span>${totalCreditos?`<span class="sem-credits-badge">${totalCreditos} créditos</span>`:''}</div><div class="sem-prog-row"><div class="sem-bar-track"><div class="sem-bar-fill" id="sem-fill-${idx}" style="width:${pct}%"></div></div><span class="sem-pct" id="sem-pct-${idx}">${pct}%</span></div>${content}</section>`;
}

function updateAllUI() {
  document.getElementById('global-pct').textContent = `${getGlobalPct()}%`;
  CURRICULUM.forEach((sem, i) => {
    const pct = getSemPct(sem);
    const fb = document.getElementById(`sem-fill-${i}`);
    const fp = document.getElementById(`sem-pct-${i}`);
    if (fb) fb.style.width = `${pct}%`;
    if (fp) fp.textContent = `${pct}%`;
    sem.materias.forEach(mat => {
      const p = getMateriaProgress(mat);
      const fg = document.querySelector(`#${buildMateriaId(mat.id)} .circ-fg`);
      if (fg) fg.style.strokeDashoffset = 107 - (107 * p / 100);
      const cn = document.querySelector(`#${buildMateriaId(mat.id)} .circ-num`);
      if (cn) cn.textContent = `${p}%`;
    });
  });
  CURRICULUM.flatMap(s => s.materias).forEach(mat => {
    (mat.bibBasicas || []).forEach((bk, bi) => {
      const caps = getBookCaps(mat.id, bi);
      const done = caps.filter(Boolean).length;
      const pct = bk.caps.length ? Math.round(done / bk.caps.length * 100) : 0;
      const pe = document.querySelector(`[data-book-pct="${mat.id}-${bi}"]`);
      const be = document.querySelector(`[data-book-bar="${mat.id}-${bi}"]`);
      if (pe) pe.textContent = `${pct}%`;
      if (be) be.style.width = `${pct}%`;
    });
  });
}

function rerenderSemester(semNum) {
  const idx = CURRICULUM.findIndex(s => s.semestre === semNum);
  if (idx < 0) return;
  const sec = document.getElementById(`semester-${semNum}`);
  if (!sec) return;
  sec.outerHTML = renderSemester(CURRICULUM[idx], idx);
}

// Scroll handler for carousel viewports — defined outside so it works after rerenders
function handleCarouselScroll(e) {
  const vp = e.target.closest('.opt-carousel-viewport');
  if (!vp) return;
  const sem = parseInt(vp.id.replace('opt-vp-', ''));
  const items = vp.querySelectorAll('.opt-item');
  if (!items.length) return;
  const vpRect = vp.getBoundingClientRect();
  const vpCenter = vpRect.top + vpRect.height / 2;
  let closestIdx = 0, closestDist = Infinity;
  items.forEach((item, i) => {
    const itemRect = item.getBoundingClientRect();
    const itemCenter = itemRect.top + itemRect.height / 2;
    const dist = Math.abs(itemCenter - vpCenter);
    if (dist < closestDist) { closestDist = dist; closestIdx = i; }
  });
  const cs = getCarousel(sem);
  cs.selectedIdx = closestIdx;
  items.forEach((item, i) => item.classList.toggle('selected', i === closestIdx));
  const posEl = document.getElementById(`opt-pos-${sem}`);
  if (posEl) posEl.textContent = `${closestIdx + 1} / ${getAvailableOpts(sem).length}`;
}

document.addEventListener('DOMContentLoaded', () => {
  // FIX: scroll al inicio al cargar
  window.scrollTo(0, 0);
  const root = document.getElementById('root');
  root.innerHTML = CURRICULUM.map((sem, i) => renderSemester(sem, i)).join('');

  root.addEventListener('click', e => {
    const tc2 = e.target.closest('[data-toggle-carousel]');
    if (tc2) {
      const sem = parseInt(tc2.dataset.toggleCarousel);
      const cs = getCarousel(sem);
      cs.open = !cs.open;
      tc2.classList.toggle('open', cs.open);
      const wrap = document.getElementById(`opt-carousel-${sem}`);
      if (wrap) wrap.classList.toggle('open', cs.open);
      return;
    }
    const oi = e.target.closest('[data-opt-item]');
    if (oi) {
      const [sem, itemIdx] = oi.dataset.optItem.split('-').map(Number);
      const available = getAvailableOpts(sem);
      const chosen = available[itemIdx];
      if (!chosen) return;

      // Find first empty slot and add immediately
      const semObj = CURRICULUM.find(s => s.semestre === sem);
      let slot = -1;
      for (let i = 0; i < (semObj.optativas || 0); i++) {
        if (!getOptSlot(sem, i)) { slot = i; break; }
      }
      if (slot < 0) return;

      setOptSlot(sem, slot, chosen);
      const cs = getCarousel(sem);
      cs.open = false;
      cs.selectedIdx = 0;
      rerenderSemester(sem);
      updateAllUI();
      return;
    }
    const orb = e.target.closest('[data-opt-remove]');
    if (orb) {
      const [sem, slot] = orb.dataset.optRemove.split('-').map(Number);
      clearOptSlot(sem, slot);
      rerenderSemester(sem);
      updateAllUI();
      return;
    }
    const ct = e.target.closest('[data-toggle-card]');
    if (ct) {
      document.querySelector(`[data-materia="${ct.dataset.toggleCard}"]`)?.classList.toggle('open');
      return;
    }
    const tab = e.target.closest('[data-tab-target]');
    if (tab) {
      const tid = tab.dataset.tabTarget;
      tab.closest('.tabs').querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      tab.closest('.card-body').querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === tid));
      return;
    }
    const th = e.target.closest('[data-tema-toggle]');
    if (th && !e.target.closest('.tema-checkbox')) {
      const key = th.dataset.temaToggle;
      const allIds = CURRICULUM.flatMap(s => s.materias).map(m => m.id);
      let materiaId = null,
        temaIdx = null;
      for (const id of allIds) {
        if (key.startsWith(id + '-')) {
          materiaId = id;
          temaIdx = parseInt(key.slice(id.length + 1));
          break;
        }
      }
      if (!materiaId) return;
      const temaEl = document.getElementById(`tema-${materiaId}-${temaIdx}`);
      if (!temaEl || !temaEl.classList.contains('done')) return;
      const isCollapsed = temaEl.classList.contains('collapsed');
      temaEl.classList.toggle('collapsed', !isCollapsed);
      setTemaCollapsed(materiaId, temaIdx, !isCollapsed);
      return;
    }
    const bt = e.target.closest('[data-toggle-book]');
    if (bt) {
      document.querySelector(`[data-book="${bt.dataset.toggleBook}"]`)?.classList.toggle('open');
      return;
    }
    const compt = e.target.closest('[data-toggle-comp]');
    if (compt) {
      document.querySelector(`[data-comp="${compt.dataset.toggleComp}"]`)?.classList.toggle('open');
      return;
    }
    const nav = e.target.closest('[data-nav]');
    if (nav) {
      const mid = nav.dataset.nav;
      const cardEl = document.getElementById(buildMateriaId(mid));
      if (cardEl) {
        cardEl.classList.add('open');
        setTimeout(() => {
          const head = cardEl.querySelector('.card-head');
          const hh = document.querySelector('.header')?.offsetHeight || 0;
          window.scrollTo({
            top: (head || cardEl).getBoundingClientRect().top + window.scrollY - hh - 12,
            behavior: 'smooth'
          });
          cardEl.classList.add('highlight-pulse');
          setTimeout(() => cardEl.classList.remove('highlight-pulse'), 1600);
        }, 100);
      }
    }
  });

  root.addEventListener('change', e => {
    const tc = e.target.closest('.tema-checkbox');
    if (tc) {
      const mid = tc.dataset.temaCheck,
        ti = parseInt(tc.dataset.temaIdx),
        checked = tc.checked;
      setTemaDone(mid, ti, checked);
      const temaEl = document.getElementById(`tema-${mid}-${ti}`);
      if (temaEl) {
        temaEl.classList.toggle('done', checked);
        if (!checked) {
          temaEl.classList.remove('collapsed');
          setTemaCollapsed(mid, ti, false);
        }
      }
      updateAllUI();
      return;
    }
    const cc = e.target.closest('.cap-check');
    if (cc) {
      const {
        mid,
        bi
      } = cc.dataset, biN = parseInt(bi);
      const container = document.querySelector(`[data-caps="${mid}-${biN}"]`);
      const allCaps = container.querySelectorAll('.cap-check');
      const states = Array.from(allCaps).map(cb => cb.checked);
      setBookCaps(mid, biN, states);
      allCaps.forEach(cb => cb.closest('.chap-item')?.classList.toggle('read', cb.checked));
      updateAllUI();
    }
  });

  // Use capturing scroll on root so it catches dynamically created viewports
  root.addEventListener('scroll', handleCarouselScroll, true);
});

  </script>
