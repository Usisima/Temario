<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Matemáticas · UNAM</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #000;
  --s1:        #080d0c;
  --s2:        #0d1512;
  --s3:        #121c18;
  --border:    rgba(100,220,200,0.08);
  --border2:   rgba(100,220,200,0.16);
  --ink:       #e8f5f2;
  --ink2:      rgba(232,245,242,0.55);
  --ink3:      rgba(232,245,242,0.28);
  --gold:      #a2e6db;
  --gold2:     #93e8d8;
  --gold-dim:  rgba(94,207,190,0.14);
  --gold-glow: rgba(94,207,190,0.06);
  --teal:      #a8f0e2;
  --teal-dim:  rgba(168,240,226,0.12);
  --r:         20px;
  --r2:        12px;
  --ease:      0.3s cubic-bezier(0.4,0,0.2,1);
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family:'DM Sans',system-ui,sans-serif;
  background:var(--bg);
  color:var(--ink);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  padding-bottom:4rem;
  position:relative;
  overflow-x:hidden;
}

/* ── HEADER ── */
.header{
  position:sticky;top:0;z-index:200;
  padding:1.2rem 1.5rem 1rem;
  display:flex;align-items:center;justify-content:space-between;
  gap:1rem;
  background:rgba(0,0,0,0.85);
  backdrop-filter:blur(20px) saturate(150%);
  border-bottom:1px solid var(--border);
}
.header::after{
  content:'';position:absolute;bottom:0;left:5%;right:5%;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  opacity:0.3;
}
.header-left{}
.header-title{
  font-family:'Playfair Display',serif;
  font-size:1.35rem;font-weight:900;
  color:var(--ink);letter-spacing:-0.01em;
  line-height:1.1;
}
.header-sub{
  font-size:10px;letter-spacing:0.16em;text-transform:uppercase;
  color:var(--ink3);margin-top:3px;
  font-weight:500;
}
.global-badge{
  font-family:'DM Mono',monospace;
  font-size:13px;font-weight:500;
  padding:6px 16px;border-radius:99px;
  border:1px solid rgba(94,207,190,0.35);
  background:rgba(94,207,190,0.08);
  color:var(--gold2);
  white-space:nowrap;
  letter-spacing:0.04em;
}

/* ── CONTAINER ── */
.container{
  max-width:600px;margin:0 auto;
  padding:0 1.2rem;
}

/* ── SEMESTER ── */
.semester{margin-top:2.5rem;}
.sem-header{
  display:flex;align-items:baseline;justify-content:space-between;
  margin-bottom:0.5rem;
  padding:0 0.2rem;
}
.sem-title{
  font-family:'Playfair Display',serif;
  font-size:0.78rem;font-weight:700;
  letter-spacing:0.14em;text-transform:uppercase;
  color:var(--ink);
}
.sem-credits-badge{
  font-family:'DM Mono',monospace;
  font-size:9px;color:var(--ink3);
  border:1px solid var(--border);
  padding:2px 8px;border-radius:99px;
  letter-spacing:0.05em;
}
.sem-prog-row{
  display:flex;align-items:center;gap:0.75rem;
  margin-bottom:1.1rem;padding:0 0.2rem;
}
.sem-bar-track{
  flex:1;height:2px;
  background:rgba(255,255,255,0.06);
  border-radius:99px;overflow:hidden;
}
.sem-bar-fill{
  height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--gold),var(--gold2));
  transition:width 0.6s cubic-bezier(0.4,0,0.2,1);
  width:0%;
}
.sem-pct{
  font-family:'DM Mono',monospace;
  font-size:10px;font-weight:500;
  color:var(--gold);min-width:32px;text-align:right;
}
.sem-grid{display:flex;flex-direction:column;gap:0.9rem;}

/* ── CARD (glassmorphism pill) ── */
.card{
  border-radius:var(--r);
  background:rgba(255,255,255,0.035);
  border:1px solid var(--border);
  backdrop-filter:blur(16px);
  box-shadow:0 4px 24px rgba(0,0,0,0.5);
  overflow:hidden;
  transition:border-color var(--ease),box-shadow var(--ease);
}
.card:hover{
  border-color:rgba(255,255,255,0.12);
  box-shadow:0 8px 40px rgba(0,0,0,0.6);
}
.card.open{
  border-color:rgba(94,207,190,0.2);
  box-shadow:0 8px 40px rgba(0,0,0,0.6),0 0 0 1px rgba(94,207,190,0.06) inset;
}

/* card header */
.card-head{
  display:flex;align-items:center;gap:0.9rem;
  padding:0.95rem 1rem;cursor:pointer;
  user-select:none;min-height:70px;
}
.card-icon{
  width:44px;height:44px;border-radius:0px;
  background:rgba(255, 255, 255, 0);
  border:0px solid var(--border2);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;overflow:hidden;
}
.card-icon img{width:100%;height:100%;object-fit:cover;border-radius:11px;}
.card-info{flex:1;min-width:0;}
.card-name{
  font-family:'Playfair Display',serif;
  font-size:0.98rem;font-weight:700;
  color:var(--ink);line-height:1.3;
}
.card-meta{display:flex;flex-wrap:wrap;gap:0.3rem;margin-top:0.4rem;}
.meta-pill{
  font-family:'DM Mono',monospace;font-size:9px;
  background:rgba(255,255,255,0.05);border:1px solid var(--border);
  padding:2px 8px;border-radius:99px;color:var(--ink3);
  letter-spacing:0.04em;
}
.meta-pill b{color:var(--ink2);font-weight:500;}

/* circle progress */
.circ-wrap{position:relative;width:46px;height:46px;flex-shrink:0;}
.circ-svg{width:46px;height:46px;display:block;}
.circ-bg{fill:none;stroke:rgba(255,255,255,0.07);stroke-width:3;}
.circ-fg{
  fill:none;stroke:var(--gold);stroke-width:3;stroke-linecap:round;
  stroke-dasharray:107;stroke-dashoffset:107;
  transform:rotate(-90deg);transform-origin:50% 50%;
  transition:stroke-dashoffset 0.5s ease;
}
.circ-num{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  font-family:'DM Mono',monospace;font-size:10px;font-weight:500;
  color:var(--teal);
  pointer-events:none;
}
.chevron{
  width:18px;height:18px;color:var(--ink3);
  transition:transform var(--ease),color var(--ease);flex-shrink:0;
}
.card.open .chevron{transform:rotate(180deg);color:var(--gold);}

/* card body */
.card-body{max-height:0;overflow:hidden;transition:max-height 0.55s cubic-bezier(0.2,1,0.4,1);}
.card.open .card-body{max-height:9999px;}

/* tabs */
.tabs{
  display:flex;background:rgba(0,0,0,0.3);
  border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);
  padding:0 1rem;gap:0.25rem;
}
.tab{
  font-size:11.5px;font-weight:600;
  padding:0.7rem 0.8rem;cursor:pointer;
  color:var(--ink3);
  border-bottom:2px solid transparent;
  letter-spacing:0.04em;text-transform:uppercase;
  transition:all var(--ease);
  white-space:nowrap;
}
.tab.active{color:var(--gold);border-bottom-color:var(--gold);}
.tab-panel{display:none;padding:1rem;}
.tab-panel.active{display:block;}
.tab-panel.biblio-panel{padding-top:0;}

/* ── TEMARIO ── */
.tema-item{
  border:1px solid var(--border);
  border-radius:var(--r2);
  overflow:hidden;
  margin-bottom:0.65rem;
  background:rgba(255,255,255,0.018);
}
.tema-head{
  display:flex;align-items:flex-start;gap:0.7rem;
  padding:0.75rem 0.9rem;
  cursor:pointer;
  background:rgba(255,255,255,0.03);
}
.tema-head-left{flex:1;display:flex;gap:0.6rem;align-items:flex-start;}
.tema-num{
  font-family:'DM Mono',monospace;font-size:9px;font-weight:500;
  background:rgba(94,207,190,0.12);border:1px solid rgba(94,207,190,0.25);
  padding:2px 7px;border-radius:6px;color:var(--gold);
  flex-shrink:0;margin-top:1px;letter-spacing:0.05em;
}
.tema-name{font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.35;}
.tema-meta{
  display:flex;align-items:center;gap:0.5rem;flex-shrink:0;
}
.tema-hrs-badge{
  font-family:'DM Mono',monospace;font-size:9px;
  color:var(--ink3);white-space:nowrap;
}
.tema-check-wrap{
  width:22px;height:22px;flex-shrink:0;
}
.tema-checkbox{
  width:22px;height:22px;border-radius:6px;
  border:2px solid var(--border2);background:transparent;
  cursor:pointer;appearance:none;
  position:relative;transition:all 0.2s;flex-shrink:0;
}
.tema-checkbox:checked{
  background:var(--gold);border-color:var(--gold);
}
.tema-checkbox:checked::after{
  content:'';position:absolute;
  width:5px;height:9px;
  border:2px solid #000;border-top:none;border-left:none;
  transform:rotate(45deg);left:5px;top:1px;
}
.tema-item.done .tema-name{text-decoration:line-through;text-decoration-thickness:1px;color:var(--ink3);}
.tema-item.done .tema-head{background:rgba(91,191,181,0.04);}
.tema-progress-bar{height:2px;background:rgba(255,255,255,0.05);}
.tema-progress-fill{height:100%;background:var(--teal);transition:width 0.3s;}

.subtema{
  font-size:12.5px;color:var(--ink3);
  padding:0.5rem 0.9rem;
  border-top:1px solid var(--border);
  line-height:1.55;
  display:flex;gap:0.5rem;
}
.subtema::before{content:"›";color:var(--gold);flex-shrink:0;font-size:14px;line-height:1.4;}

.tema-subtemas{}

.sec-label{
  font-size:9px;font-weight:700;letter-spacing:0.18em;
  text-transform:uppercase;color:var(--ink3);
  margin:1rem 0 0.6rem;
  display:flex;align-items:center;gap:0.6rem;
  padding:0.75rem 1rem 0;
}
.sec-label:first-child{padding-top:0.75rem;margin-top:0;}
.sec-label::after{content:'';flex:1;height:1px;background:var(--border);}

/* ── BOOKS ── */
.book-card{
  border:1px solid var(--border);border-radius:var(--r2);
  overflow:hidden;margin-bottom:0.65rem;
}
.book-head{
  display:flex;align-items:flex-start;gap:0.6rem;
  padding:0.7rem 0.9rem;cursor:pointer;
  background:rgba(255,255,255,0.025);
}
.book-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--teal);flex-shrink:0;margin-top:0.4rem;
}
.book-name{font-size:11.5px;color:var(--ink2);line-height:1.5;font-weight:400;flex:1;}
.book-right{display:flex;align-items:center;gap:0.4rem;flex-shrink:0;}
.book-pct-badge{
  font-family:'DM Mono',monospace;font-size:9px;
  background:var(--teal-dim);border:1px solid rgba(91,191,181,0.25);
  padding:2px 8px;border-radius:99px;color:var(--teal);
}
.bk-chev{width:14px;height:14px;color:var(--ink3);transition:transform 0.2s;flex-shrink:0;}
.book-card.open .bk-chev{transform:rotate(180deg);}
.book-prog-bar{height:2px;background:rgba(91,191,181,0.08);}
.book-prog-fill{height:100%;background:var(--teal);transition:width 0.3s;}
.book-body{max-height:0;overflow:hidden;transition:max-height 0.3s ease;}
.book-card.open .book-body{max-height:600px;}
.chapters-list{padding:0.5rem 0.8rem 0.8rem;display:flex;flex-direction:column;gap:3px;}
.chap-item{
  display:flex;align-items:center;gap:0.7rem;
  padding:0.55rem 0.5rem;border-radius:8px;
  transition:background 0.15s;
}
.chap-item:hover{background:rgba(91,191,181,0.05);}
.chap-item.read{background:rgba(91,191,181,0.06);}
.cap-check{
  width:18px;height:18px;border-radius:4px;
  border:1.5px solid var(--border2);background:transparent;
  cursor:pointer;appearance:none;position:relative;
  transition:all 0.15s;flex-shrink:0;
}
.cap-check:checked{background:var(--teal);border-color:var(--teal);}
.cap-check:checked::after{
  content:'';position:absolute;
  width:4px;height:7px;
  border:1.5px solid #000;border-top:none;border-left:none;
  transform:rotate(45deg);left:4px;top:1px;
}
.chap-label{font-size:12px;color:var(--ink3);flex:1;cursor:pointer;line-height:1.4;}
.chap-item.read .chap-label{color:var(--teal);text-decoration:line-through;text-decoration-thickness:1px;opacity:0.7;}

.comp-section{
  border:1px solid var(--border);border-radius:var(--r2);
  overflow:hidden;margin-top:0.25rem;
}
.comp-toggle{
  display:flex;align-items:center;justify-content:space-between;
  padding:0.65rem 0.9rem;cursor:pointer;
  background:rgba(255,255,255,0.02);
}
.comp-title{font-size:11px;font-weight:600;color:var(--ink3);letter-spacing:0.05em;}
.comp-chev{width:14px;height:14px;min-width:14px;min-height:14px;color:var(--ink3);transition:transform 0.2s;display:block;}
.comp-section.open .comp-chev{transform:rotate(180deg);}
.comp-body{max-height:0;overflow:hidden;transition:max-height 0.3s;}
.comp-section.open .comp-body{max-height:500px;}
.comp-entry{
  font-size:11.5px;color:var(--ink3);
  padding:0.55rem 0.9rem;border-top:1px solid var(--border);
  display:flex;gap:0.5rem;line-height:1.5;
}
.comp-entry::before{content:"→";color:var(--gold);flex-shrink:0;}

/* ── SUBSECUENTES ── */
.subsec-block{
  margin:0;padding:0.75rem 1rem 1rem;
  background:rgba(94,207,190,0.04);
  border:none;border-top:1px solid rgba(94,207,190,0.12);
  border-radius:0;
}
.subsec-label{
  font-size:9px;font-weight:700;letter-spacing:0.14em;
  text-transform:uppercase;color:var(--gold);margin-bottom:0.5rem;
}
.subsec-tags{display:flex;flex-wrap:wrap;gap:0.35rem;}
.subsec-tag{
  font-size:11px;
  background:rgba(94,207,190,0.07);
  border:1px solid rgba(94,207,190,0.2);
  padding:4px 10px;border-radius:99px;
  color:var(--gold);cursor:pointer;
  transition:all 0.2s;
  display:flex;align-items:center;gap:4px;
}
.subsec-tag:hover{
  background:rgba(94,207,190,0.15);
  border-color:rgba(94,207,190,0.4);
}
.subsec-tag-arrow{font-size:9px;opacity:0.6;}
.subsec-tag.no-link{cursor:default;opacity:0.5;}
.subsec-tag.no-link:hover{background:rgba(94,207,190,0.07);border-color:rgba(94,207,190,0.2);}

/* empty */
.empty-card{
  padding:2rem;text-align:center;color:var(--ink3);
  border:1px dashed var(--border);border-radius:var(--r);
  font-size:12px;letter-spacing:0.06em;
  font-family:'DM Mono',monospace;
}

/* ── HOVER HIGHLIGHT on card when target ── */
.card.highlight-pulse{
  animation:pulseBorder 1.5s ease forwards;
}
@keyframes pulseBorder{
  0%{border-color:rgba(94,207,190,0.6);box-shadow:0 0 0 4px rgba(94,207,190,0.15);}
  100%{border-color:rgba(94,207,190,0.2);box-shadow:0 8px 40px rgba(0,0,0,0.6);}
}

/* scrollbar */
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:99px;}

/* Ornamental top bar */
.orn-top{
  text-align:center;padding:1.2rem 1.5rem 0;
  letter-spacing:0.3em;color:rgba(94,207,190,0.25);
  font-size:11px;font-family:'DM Mono',monospace;
}

/* ── OPTATIVA CARD ── */
.optativa-card {
  border-radius: var(--r);
  border: 1px dashed rgba(255,255,255,0.1);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 0.9rem 1rem 0.85rem;
  gap: 0.45rem;
}
.optativa-name {
  font-family: 'Playfair Display', serif;
  font-size: 0.95rem;
  font-weight: 700;
  color: rgba(255,255,255,0.75);
  text-align: center;
}
.optativa-tag {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  color: rgba(255,255,255,0.28);
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
  padding: 2px 8px;
  border-radius: 99px;
  white-space: nowrap;
  letter-spacing: 0.04em;
}
</style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <div class="header-title">Matemáticas</div>
    <div class="header-sub">Facultad de Ciencias · UNAM</div>
  </div>
  <span class="global-badge" id="global-pct">0%</span>
</header>

<div class="container" id="root"></div>

// ── STORAGE ──
const SK_TEMA = 'mat_tema_v1';
const SK_BOOK = 'mat_book_v1';
function loadDB(key){ try{ return JSON.parse(localStorage.getItem(key)||'{}'); }catch{ return {}; } }
function saveDB(key,db){ localStorage.setItem(key,JSON.stringify(db)); }
let temaDB = loadDB(SK_TEMA);
let bookDB = loadDB(SK_BOOK);

function getTemaDone(mid,ti){ return temaDB[`${mid}_${ti}`]===true; }
function setTemaDone(mid,ti,val){ temaDB[`${mid}_${ti}`]=val; saveDB(SK_TEMA,temaDB); }
function getBookCaps(mid,bi){ return bookDB[`${mid}_${bi}`]||[]; }
function setBookCaps(mid,bi,arr){ bookDB[`${mid}_${bi}`]=arr; saveDB(SK_BOOK,bookDB); }

// ── PROGRESS CALC ──
function getMateriaProgress(mat){
  let totalH=0, doneH=0;
  (mat.temario||[]).forEach((t,i)=>{
    const h=t.horas||((t.subtemas||[]).length*2);
    totalH+=h;
    if(getTemaDone(mat.id,i)) doneH+=h;
  });
  if(totalH===0) return 0;
  return Math.min(100,Math.round((doneH/totalH)*100));
}
function isComplete(mat){ return getMateriaProgress(mat)===100; }
function getAccumulatedCredits(){ return CURRICULUM.flatMap(s=>s.materias).filter(m=>isComplete(m)).reduce((s,m)=>s+m.creditos,0); }
function getGlobalPct(){ return Math.min(100,Math.round((getAccumulatedCredits()/TOTAL_CREDITOS)*100)); }
function getSemPct(sem){
  const all=sem.materias, tc=all.reduce((s,m)=>s+m.creditos,0);
  if(!tc) return 0;
  const dc=all.filter(m=>isComplete(m)).reduce((s,m)=>s+m.creditos,0);
  return Math.min(100,Math.round((dc/tc)*100));
}

const svgChev = `<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="3,5 7,9 11,5"/></svg>`;

function buildMateriaId(id){ return `card-${id}`; }

function renderOptativaCard(){
  return `<div class="optativa-card">
    <span class="optativa-name">Optativa</span>
    <span class="optativa-tag">10 créditos</span>
  </div>`;
}

function renderTemario(mat){
  if(!mat.temario||!mat.temario.length) return '<div style="padding:1rem;color:var(--ink3);font-size:12px;">Temario en construcción</div>';
  return mat.temario.map((t,i)=>{
    const done=getTemaDone(mat.id,i);
    const h=t.horas||((t.subtemas||[]).length*2);
    const subs=(t.subtemas||[]).map(s=>`<div class="subtema">${s}</div>`).join('');
    return `<div class="tema-item ${done?'done':''}" id="tema-${mat.id}-${i}">
      <div class="tema-head" data-tema-toggle="${mat.id}-${i}">
        <div class="tema-head-left">
          <span class="tema-num">${t.num}</span>
          <span class="tema-name">${t.name}</span>
        </div>
        <div class="tema-meta">
          <span class="tema-hrs-badge">${h}h</span>
          <input class="tema-checkbox" type="checkbox" ${done?'checked':''} data-tema-check="${mat.id}" data-tema-idx="${i}" onclick="event.stopPropagation()">
        </div>
      </div>
      <div class="tema-subtemas">${subs}</div>
    </div>`;
  }).join('');
}

function renderBiblio(mat){
  const booksHtml=(mat.bibBasicas||[]).map((bk,bi)=>{
    const caps=getBookCaps(mat.id,bi);
    const done=caps.filter(Boolean).length;
    const pct=bk.caps.length?Math.round((done/bk.caps.length)*100):0;
    const chaps=bk.caps.map((c,ci)=>{
      const checked=caps[ci]===true;
      return `<div class="chap-item ${checked?'read':''}">
        <input class="cap-check" type="checkbox" ${checked?'checked':''} data-mid="${mat.id}" data-bi="${bi}" data-ci="${ci}">
        <span class="chap-label">${c}</span>
      </div>`;
    }).join('');
    return `<div class="book-card" data-book="${mat.id}-${bi}">
      <div class="book-head" data-toggle-book="${mat.id}-${bi}">
        <div class="book-dot"></div>
        <span class="book-name">${bk.name}</span>
        <div class="book-right">
          <span class="book-pct-badge" data-book-pct="${mat.id}-${bi}">${pct}%</span>
          <svg class="bk-chev" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="3,5 7,9 11,5"/></svg>

      <div class="book-body"><div class="chapters-list" data-caps="${mat.id}-${bi}">${chaps}</div></div>

  }).join('');
  const compList=(mat.bibComp||[]).map(c=>`<div class="comp-entry">${c}</div>`).join('')||'<div class="comp-entry" style="color:var(--ink3)">Sin referencias complementarias</div>';

      <div class="comp-body">${compList}</div>

}

            <circle class="circ-fg" cx="23" cy="23" r="17" style="stroke-dashoffset:${offset}"/>
          </svg>
          <span class="circ-num">${pct}%</span>
        </div>
        <svg class="chevron" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><polyline points="5,7 10,13 15,7"/></svg>
      </div>
    </div>
    <div class="card-body">
      <div class="tabs">
        <div class="tab active" data-tab-target="${mat.id}-temario">Temario</div>
        <div class="tab" data-tab-target="${mat.id}-biblio">Bibliografía</div>
      </div>
      <div class="tab-panel active" id="${mat.id}-temario">${renderTemario(mat)}</div>
      <div class="tab-panel" id="${mat.id}-biblio" style="padding:0">${renderBiblio(mat)}</div>
      ${renderSubsecuentes(mat)}
    </div>
  </div>`;
}

function renderSemester(sem,idx){
  const pct=getSemPct(sem);
  const tc=sem.materias.reduce((s,m)=>s+m.creditos,0);
  const optativaCreditos = (sem.optativas||0) * 10;
  const totalCreditos = tc + optativaCreditos;

  let content = '';
  if(sem.materias.length || sem.optativas){
    const cards = sem.materias.map(renderCard).join('');
    const opts = Array.from({length: sem.optativas||0}, renderOptativaCard).join('');
    content = `<div class="sem-grid">${cards}${opts}</div>`;
  } else {
    content = `<div class="empty-card">· · · por cursar · · ·</div>`;
  }

  return `<section class="semester">
    <div class="sem-header">
      <span class="sem-title">${sem.titulo}</span>
      ${totalCreditos ? `<span class="sem-credits-badge">${totalCreditos} créditos</span>` : ''}
    </div>
    <div class="sem-prog-row">
      <div class="sem-bar-track"><div class="sem-bar-fill" id="sem-fill-${idx}" style="width:${pct}%"></div></div>
      <span class="sem-pct" id="sem-pct-${idx}">${pct}%</span>
    </div>
    ${content}
  </section>`;
}

// ── UPDATE UI ──
function updateAllUI(){
  document.getElementById('global-pct').textContent=`${getGlobalPct()}%`;
  CURRICULUM.forEach((sem,i)=>{
    const pct=getSemPct(sem);
    const fb=document.getElementById(`sem-fill-${i}`);
    const fp=document.getElementById(`sem-pct-${i}`);
    if(fb) fb.style.width=`${pct}%`;
    if(fp) fp.textContent=`${pct}%`;
    sem.materias.forEach(mat=>{
      const pct2=getMateriaProgress(mat);
      const circ=document.querySelector(`#${buildMateriaId(mat.id)} .circ-fg`);
      if(circ){ const c=107; circ.style.strokeDashoffset=c-(c*pct2/100); }
      const num=document.querySelector(`#${buildMateriaId(mat.id)} .circ-num`);
      if(num) num.textContent=`${pct2}%`;
    });
  });
  CURRICULUM.flatMap(s=>s.materias).forEach(mat=>{
    (mat.bibBasicas||[]).forEach((bk,bi)=>{
      const caps=getBookCaps(mat.id,bi);
      const done=caps.filter(Boolean).length;
      const pct=bk.caps.length?Math.round((done/bk.caps.length)*100):0;
      const pctEl=document.querySelector(`[data-book-pct="${mat.id}-${bi}"]`);
      const barEl=document.querySelector(`[data-book-bar="${mat.id}-${bi}"]`);
      if(pctEl) pctEl.textContent=`${pct}%`;
      if(barEl) barEl.style.width=`${pct}%`;
    });
  });
}

// ── INIT ──
document.addEventListener('DOMContentLoaded',()=>{
  const root=document.getElementById('root');
  root.innerHTML=CURRICULUM.map((sem,i)=>renderSemester(sem,i)).join('');

  root.addEventListener('click',e=>{
    const ct=e.target.closest('[data-toggle-card]');
    if(ct){ document.querySelector(`[data-materia="${ct.dataset.toggleCard}"]`)?.classList.toggle('open'); return; }
    const tab=e.target.closest('[data-tab-target]');
    if(tab){
      const tid=tab.dataset.tabTarget;
      tab.closest('.tabs').querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      tab.closest('.card-body').querySelectorAll('.tab-panel').forEach(p=>p.classList.toggle('active',p.id===tid));
      return;
    }
    const bt=e.target.closest('[data-toggle-book]');
    if(bt){ document.querySelector(`[data-book="${bt.dataset.toggleBook}"]`)?.classList.toggle('open'); return; }
    const compt=e.target.closest('[data-toggle-comp]');
    if(compt){ document.querySelector(`[data-comp="${compt.dataset.toggleComp}"]`)?.classList.toggle('open'); return; }
    const nav=e.target.closest('[data-nav]');
    if(nav){
      const mid=nav.dataset.nav;
      const cardEl=document.getElementById(buildMateriaId(mid));
      if(cardEl){
        cardEl.classList.add('open');
        setTimeout(()=>{
          cardEl.scrollIntoView({behavior:'smooth',block:'start'});
          cardEl.classList.add('highlight-pulse');
          setTimeout(()=>cardEl.classList.remove('highlight-pulse'),1600);
        },100);
      }
    }
  });

  root.addEventListener('change',e=>{
    const tc=e.target.closest('.tema-checkbox');
    if(tc){
      const mid=tc.dataset.temaCheck;
      const ti=parseInt(tc.dataset.temaIdx);
      setTemaDone(mid,ti,tc.checked);
      document.getElementById(`tema-${mid}-${ti}`)?.classList.toggle('done',tc.checked);
      updateAllUI();
      return;
    }
    const cc=e.target.closest('.cap-check');
    if(cc){
      const {mid,bi,ci}=cc.dataset;
      const biN=parseInt(bi),ciN=parseInt(ci);
      const container=document.querySelector(`[data-caps="${mid}-${biN}"]`);
      const allCaps=container.querySelectorAll('.cap-check');
      const states=Array.from(allCaps).map(cb=>cb.checked);
      setBookCaps(mid,biN,states);
      allCaps.forEach(cb=>cb.closest('.chap-item')?.classList.toggle('read',cb.checked));
      updateAllUI();
    }
  });
});
</script>
